# poc-radio.yaml - "recipe" for the Aurora build-engine (sfdk / spectacle).
#
# HOW IT WORKS (important after the last failures):
#   sfdk converts this yaml into a spec file every time you run qmake.
#   If rpm/poc-radio.spec already exists but was NOT generated by
#   spectacle, sfdk asks:
#       "Existing spec file was not generated by spectacle, continue?(y/N)"
#   Answering N aborts the build ("Failed to convert .yaml to .spec").
#   So the workflow is: keep this yaml as the single source of truth and
#   let spectacle generate poc-radio.spec from it (answer Y once).
#
# RULES LEARNED FROM PREVIOUS FAILURES:
#   1) This is YAML: RPM directives (they all start with the percent
#      character) break the parser here.
#      That is why there is no "Rules:" section here - the build commands
#      live in the generated spec instead.
#   2) Mandatory main-package keys: Name, Version, Release, Summary, License.
#   3) Key names expected by spectacle: PkgConfigBR or PkgBR (NOT
#      BuildRequires), URL (NOT Url), Files as a list of plain strings.
#   4) Group must be taken from
#      <target>/usr/share/spectacle/GROUPS - see the note at the bottom.

Name:       poc-radio
Version:    0.1
Release:    1
Summary:    Proof-of-concept push-to-talk radio client for Aurora OS
License:    MIT
Group:      Applications/Publishing And Printing
URL:        https://example.org/poc-radio
Description: |
  Console push-to-talk radio client prototype for Aurora OS: TCP
  signalling connection, channel join, PTT talk and listen.
  Training project, stages 1-2.

# Packages installed INSIDE the build container only during the build.
PkgConfigBR:
    - qt5-qtbase-devel

# Libraries that must already exist on the phone/emulator to run the app.
Requires:
    - qt5-qtbase

# What goes into the package. A plain string means: install the binary
# produced by the build into that path. No spaces issues, no dict form.
Files:
    - poc-radio
