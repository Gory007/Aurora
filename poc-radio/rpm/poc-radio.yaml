# poc-radio.yaml - recipe for the Aurora build-engine (sfdk / spectacle).
#
# STATUS: kept as documentation/fallback only. Because poc-radio.spec
# exists next to it, sfdk uses the spec file and does NOT regenerate a
# spec from this yaml. The build/install logic therefore lives in the
# spec (%build / %install / %files), not here.
#
# Rules learned from the previous failures:
#  1) This is YAML: RPM directives with a percent sign break the parser
#     ("found character '%' that cannot start any token").
#  2) Mandatory main-package keys: Name, Version, Release, Summary, License.
#  3) Key names expected by spectacle: PkgConfigBR / PkgBR (NOT
#     BuildRequires), Requires, Files as a list of strings.
#  4) Group must come from <target>/usr/share/spectacle/GROUPS.

Name:       poc-radio
Version:    0.1
Release:    1
Summary:    Proof-of-concept push-to-talk radio client for Aurora OS
License:    MIT
Group:      Applications/Comms And Sync
Url:        https://example.org/poc-radio
Description: |
  Console push-to-talk radio client prototype for Aurora OS: TCP
  signalling connection, channel join, PTT talk and listen.
  Training project, stages 1-2.

PkgConfigBR:
    - qt5-qtbase-devel

Requires:
    - qt5-qtbase

Files:
    - "%{_bindir}/poc-radio"
